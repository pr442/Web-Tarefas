{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Tarefa{% endblock %}

{% block body %}

<div class="container">
    <br>
    <form method="POST" enctype="multipart/form-data" action="{% if tarefa %}{% url 'app:tarefa_edit' tarefa.id %}{% else %}{% url 'app:tarefa_form' %}{% endif %}">
        {% csrf_token %}
        <div class="input-group mb-3">
            
            <span class="input-group-text" id="basic-addonTitulo">Titulo</span>
            <input type="text" class="form-control" name="titulo" placeholder="Titulo" aria-label="Titulo" aria-describedby="basic-addonTitulo" value="{{ tarefa.titulo|default:'' }}">
        </div>
        <div class="row">
            <div class="col">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addondescricao">descricao</span>
                    <input type="text" class="form-control" name="descricao" placeholder="descricao" aria-label="descricao" aria-describedby="basic-addondescricao"  value="{{ tarefa.descricao|default:'' }}">
                </div>
            </div>
               
            <div class="col">
                <div class="input-group mb-3">
                    <input type="date" class="form-control" name="data_limite" placeholder="Data Limite" aria-label="responsavel" aria-describedby="basic-addondata_limite"  value="{{ tarefa.data_limite|default:'' }}">
                    <span class="input-group-text" id="basic-addondata_limite"></span>
                </div>
            </div>
                        <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addonresponsavel">Responsável</span>
                    <select class="form-select" name="responsavel" aria-describedby="basic-addonresponsavel" required>
                        <option value="">Selecione o responsável</option>
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id }}" {% if tarefa and tarefa.responsavel.id == usuario.id %}selected{% endif %}>  
                            {{ usuario.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col">
                 <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" name="status" id="status" value="Concluída" {% if tarefa and tarefa.status == 'Concluída' %}checked{% endif %}>
                        <label class="form-check-label" for="status">Concluída</label>
            </div></div>
                        
</div>

           
        <div class="input-group mb-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>

    </form>
</div>

{% endblock %}
